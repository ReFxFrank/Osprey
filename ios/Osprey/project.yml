# XcodeGen project spec.
#
# The Xcode project is generated from this file rather than committed as an
# .xcodeproj bundle, because the app is authored on a machine without Xcode and
# only built on a cloud Mac. A text spec stays reviewable and merges; an
# .xcodeproj is a binary blob only Xcode can edit sanely.
#
# Regenerate with:  cd ios/Osprey && xcodegen generate
#
# Run scripts/build-xcframework.sh BEFORE generating. It writes to
# agent/target/xcframework/; the build then stages Osprey.xcframework and the
# generated osprey_ffi.swift into ios/Osprey/Frameworks/ (see
# .github/workflows/ios.yml). Both are generated output and are not committed.
#
# The binding is staged into Frameworks/, deliberately NOT into
# Osprey/Generated/: proto/generate.ts deletes every .swift in that directory it
# did not itself emit, so a UniFFI binding parked there would silently vanish on
# the next `pnpm generate` and break the iOS build in a way that looks unrelated.
#
# INFO.PLIST OWNERSHIP — Osprey/Info.plist is hand-maintained and authoritative.
# This spec deliberately has no `info:` block: XcodeGen *overwrites* the file at
# `info.path` from `info.properties` on every generate, which would have dropped
# LSRequiresIPhoneOS (it exists only in the committed plist) the first time
# anyone ran the tool. Add a key to Osprey/Info.plist, not here. The reverse
# arrangement — generate the plist and gitignore it — was rejected because
# docs/ios-build.md documents the committed file as present and because the
# generated result would be an untracked file the repo's .gitignore does not
# cover.

name: Osprey

options:
  bundleIdPrefix: com.osprey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The app is a single module; the UniFFI-generated Swift is compiled into it
    # rather than imported, so strict concurrency applies to it too.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # Without a team, Automatic signing leaves the generated project unrunnable
    # from the Xcode UI until someone picks one by hand — a cost paid in metered
    # cloud-Mac minutes every time the project is regenerated. Team FM8Z8BA64H
    # is the one com.ospreyremote.app is registered under (amendment A21). CI
    # overrides this for the archive step with the APPLE_TEAM_ID secret.
    DEVELOPMENT_TEAM: FM8Z8BA64H

targets:
  Osprey:
    type: application
    platform: iOS
    sources:
      - path: Osprey
      # UniFFI's generated binding, staged here by the build. Compiled into this
      # target rather than imported as a module — it is what defines the Rust
      # types FFINoiseEngine uses, and it imports the C shim from the
      # XCFramework's modulemap itself.
      - path: Frameworks/osprey_ffi.swift
        optional: true
        group: Frameworks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ospreyremote.app
        TARGETED_DEVICE_FAMILY: "1,2"
        # Relative to SRCROOT, which for a project generated into ios/Osprey is
        # ios/Osprey. Set here rather than via an `info:` block so XcodeGen
        # points at the committed plist instead of rewriting it — see INFO.PLIST
        # OWNERSHIP at the top of this file.
        INFOPLIST_FILE: Osprey/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      # Static library + C shim modulemap produced by scripts/build-xcframework.sh
      # (as agent/target/xcframework/Osprey.xcframework) and staged here.
      # Static, so it is linked, not embedded.
      - framework: Frameworks/Osprey.xcframework
        embed: false

  OspreyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OspreyTests
    dependencies:
      - target: Osprey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ospreyremote.app.tests
        DEVELOPMENT_TEAM: FM8Z8BA64H
        # Every file in OspreyTests does `@testable import Osprey`, so the bundle
        # has to be loaded by the app rather than run as a free-standing logic
        # test. Spelled out rather than left to XcodeGen's inference so the
        # requirement is visible where it is depended on.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osprey.app/Osprey
        BUNDLE_LOADER: $(TEST_HOST)
        # An .xctest bundle will not load without an Info.plist. The app's is
        # committed; the test bundle's carries nothing worth reviewing, so let
        # Xcode synthesise it.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Osprey:
    build:
      targets:
        Osprey: all
    test:
      targets:
        - OspreyTests
