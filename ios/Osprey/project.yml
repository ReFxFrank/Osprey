# XcodeGen project spec.
#
# The Xcode project is generated from this file rather than committed as an
# .xcodeproj bundle, because the app is authored on a machine without Xcode and
# only built on a cloud Mac. A text spec stays reviewable and merges; an
# .xcodeproj is a binary blob only Xcode can edit sanely.
#
# Regenerate with:  cd ios/Osprey && xcodegen generate
#
# Run scripts/build-xcframework.sh BEFORE generating: it produces
# build/OspreyFFI.xcframework and the generated bindings source referenced below.

name: Osprey

options:
  bundleIdPrefix: com.osprey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The app is a single module; the UniFFI-generated Swift is compiled into it
    # rather than imported, so strict concurrency applies to it too.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

targets:
  Osprey:
    type: application
    platform: iOS
    sources:
      - path: Osprey
      # UniFFI's generated binding. Produced by scripts/build-xcframework.sh into
      # build/bindings/. It is generated output, so it is not committed; the
      # build script must run first or generation fails loudly here.
      - path: ../../build/bindings/osprey_ffi.swift
        optional: true
        group: Generated
    info:
      path: Osprey/Info.plist
      properties:
        CFBundleDisplayName: Osprey
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Camera: the QR pairing scan. Absent, the first capture attempt is a
        # hard crash, not a permission denial.
        NSCameraUsageDescription: >-
          Osprey scans the pairing QR code shown on your computer. Pairing
          requires physical access to that machine.
        # iOS 14+ prompts on ANY local-network connection, including a plain TCP
        # connect to a private address. Absent, the connection silently never
        # becomes ready.
        NSLocalNetworkUsageDescription: >-
          Osprey connects directly to your computer on your local network, so
          your screen and files never leave your own machines.
        # Required to browse the agent's mDNS advertisement (amendment A6).
        NSBonjourServices:
          - _osprey._tcp
        # Osprey uses only standard, exempt cryptography (Noise/TLS). Declaring
        # this avoids the export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osprey.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      # Static library + C shim modulemap produced by scripts/build-xcframework.sh.
      - framework: ../../build/OspreyFFI.xcframework
        embed: false

  OspreyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OspreyTests
    dependencies:
      - target: Osprey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osprey.app.tests

schemes:
  Osprey:
    build:
      targets:
        Osprey: all
    test:
      targets:
        - OspreyTests
