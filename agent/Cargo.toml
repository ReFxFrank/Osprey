[workspace]
resolver = "2"
members = ["osprey-core", "osprey-proto", "osprey-svc", "osprey-helper", "osprey-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# NOTE: deliberately NOT declared here. snow must be taken with
# default-features = false (see osprey-core), and `default-features` is ignored
# on a workspace-inherited dependency — inheriting it would silently re-enable
# the `ring` C dependency and break the Apple cross-build.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zeroize = "1"
