[package]
name = "osprey-svc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Osprey agent console: pairing, steady-state sessions, and local unpair enforcement."

[lib]
name = "osprey_svc"
path = "src/lib.rs"

[[bin]]
name = "osprey-svc"
path = "src/main.rs"

[dependencies]
osprey-core = { path = "../osprey-core" }
osprey-proto = { path = "../osprey-proto" }
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
hex = "0.4"
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"
# LAN service discovery (amendment A6). Chosen over `zeroconf`/`astro-dnssd`
# because those bind the platform Bonjour/Avahi daemon through C FFI, which
# would put a C toolchain back in the cross-compile path; mdns-sd is pure Rust
# and carries no async runtime. Default features off: they only add a `flume`
# async channel this crate never awaits.
mdns-sd = { version = "0.20", default-features = false }
# `rustls` is not an option here: ureq's rustls path pulls `ring`, whose build
# script shells out to `lib.exe`, which breaks `--target x86_64-pc-windows-msvc`
# from Linux CI outright (measured: "failed to find tool \"lib.exe\""). This is
# the same trap osprey-core documents for snow. native-tls resolves to schannel
# on the shipping Windows target — no C toolchain — and to OpenSSL on the Linux
# CI host.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

# M-01 reads whole-machine counters straight from Win32. The DRIVE_* constants
# live in WindowsProgramming rather than beside GetDriveTypeW, and GetIfTable2
# and MIB_IF_TABLE2 are cfg-gated on Ndis *in addition* to IpHelper — omitting
# either feature makes the symbol silently not exist.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

[dev-dependencies]
tempfile = "3"
